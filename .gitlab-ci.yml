# ─────────────────────────────────────────────────────────────────────────────
# Override all security scanning jobs

spotbugs-sast:
  needs:
    - install
  rules:
    - !reference [.security_default_rules, rules]
  variables:
    COMPILE: "false"
    SECURE_LOG_LEVEL: debug

gitlab-advanced-sast:
  dependencies:
    - install
  needs:
    - install
  rules:
    - !reference [.security_default_rules, rules]
  artifacts:
    paths:
      - '**/trace.ctf'
    expire_in: 1 week
    when: always
  variables:
    RUNNER_SCRIPT_TIMEOUT: 50m
  timeout: 1h

container-scanning:local:
  extends: container_scanning
  stage: security
  rules:
    - !reference [.security_default_rules, rules]
  needs:
    - check:build:local:fl-net-staging
  dependencies:
    - check:build:local:fl-net-staging
  variables:
    CS_IMAGE: "archive://fl-net-local.tar"

container-scanning:global:
  extends: container_scanning
  stage: security
  rules:
    - !reference [.security_default_rules, rules]
  needs:
    - check:build:global:fl-net-staging
  dependencies:
    - check:build:global:fl-net-staging
  variables:
    CS_IMAGE:  "archive://fl-net-global.tar"

secret_detection:
  needs:
    - install
  dependencies:
    - install
  stage: security
  rules:
    - !reference [.security_default_rules, rules]
  variables:
    GIT_DEPTH: 100

gemnasium-dependency_scanning:
  needs:
    - install
  dependencies:
    - install
  rules:
    - !reference [.security_default_rules, rules ]
# Use the generic dependancy scanner
