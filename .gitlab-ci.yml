stages:
  - check
  - security
  - deploy

variables:
  CI_LOCAL_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/local
  CI_GLOBAL_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/global

  CI_LOCAL_IMAGE_STAGING: CI_LOCAL_IMAGE:staging
  CI_GLOBAL_IMAGE_STAGING: CI_GLOBAL_IMAGE:staging

  CI_LOCAL_IMAGE_PROD: CI_LOCAL_IMAGE:prod
  CI_GLOBAL_IMAGE_PROD: CI_GLOBAL_IMAGE:prod

  CI_LOCAL_IMAGE_LATEST: CI_LOCAL_IMAGE:latest
  CI_GLOBAL_IMAGE_LATEST: CI_GLOBAL_IMAGE:latest

  TAR_FILE_DIR: ".images/"
  TAR_FILE_NAME_LOCAL: "local-image.tar"
  TAR_FILE_NAME_GLOBAL: "global-image.tar"

  TRIVY_IMAGE: trivy:latest
  TRIVY_TAR: trivy-latest.tar

.docker_login: &docker_login
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.docker_buildx: &docker_buildx
  - docker context create fedDB-context
  - docker buildx create --name fedDBBuilder --use fedDB-context
  - docker buildx inspect --bootstrap

.docker_buildxrm: &docker_buildxrm
  - docker buildx rm fedDBBuilder

.load_trivy_image: &load_trivy_image
  - docker image load -i $TAR_FILE_DIR$TRIVY_TAR

.load_target_image: &load_target_image
  - docker image load -i $TAR_FILE_DIR$TAG-$TAR_FILE_NAME
# format reports to html and junit and fails the pipeline on HIGH,CRITICAL issues
.format_report: &format_report
  - docker run -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/Library/Caches:/root/.cache/ -v $PWD:/target $TRIVY_IMAGE convert
    --format template --template "@/contrib/junit.tpl" target/trivy-$REPORT_NAME-full-report.json --severity CRITICAL,HIGH -o target/trivy-$REPORT_NAME-important-report.xml
  - docker run -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/Library/Caches:/root/.cache/ -v $PWD:/target $TRIVY_IMAGE convert
    --format template --template "@/contrib/html.tpl" target/trivy-$REPORT_NAME-full-report.json -o target/trivy-$REPORT_NAME-full-report.html
  - docker run -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/Library/Caches:/root/.cache/ -v $PWD:/target $TRIVY_IMAGE convert
    --format template --template "@/contrib/html.tpl" target/trivy-$REPORT_NAME-full-report.json --severity HIGH,CRITICAL -o target/trivy-$REPORT_NAME-important-report.html
  - docker run -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/Library/Caches:/root/.cache/ -v $PWD:/target $TRIVY_IMAGE convert
    --exit-code 1 --format table target/trivy-$REPORT_NAME-full-report.json --severity HIGH,CRITICAL --dependency-tree

# exports reports as artifacts
.export_reports: &export_reports
  when: always
  expire_in: 1 week
  reports:
    junit: trivy-$REPORT_NAME-important-report.xml
  paths:
    - trivy-$REPORT_NAME-important-report.html
    - trivy-$REPORT_NAME-full-report.html
    - trivy-$REPORT_NAME-full-report.json

check:lint:local:
  stage: check
  image: node:20-alpine
  script:
    - npm i --no-audit
    - npm run lint-local

check:lint:shared:
  stage: check
  image: node:20-alpine
  script:
    - npm i --no-audit
    - npm run lint-shared-lib

check:lint:global:
  stage: check
  image: node:20-alpine
  script:
    - npm i --no-audit
    - npm run lint-global

# builds api and db images and saves them as tar files
.check:build:
  image: docker:latest
  stage: check
  services:
    - name: registry.blitzhub.io/docker:dind
      alias: docker
  before_script:
    - mkdir -p $TAR_FILE_DIR
    - *docker_login
  script:
    - docker build -t $CI_LOCAL_IMAGE:$TAG -f ./Dockerfile.local .
    - docker save -o $TAR_FILE_DIR$TAG-$TAR_FILE_NAME_LOCAL $CI_LOCAL_IMAGE:$TAG
    - echo "API image created at $TAR_FILE_DIR$TAG-$TAR_FILE_NAME_LOCAL"

    - docker build -t $CI_GLOBAL_IMAGE:$TAG -f ./Dockerfile.global .
    - docker save -o $TAR_FILE_DIR$TAG-$TAR_FILE_NAME_GLOBAL $CI_GLOBAL_IMAGE:$TAG
    - echo "DB image created at $TAR_FILE_DIR$TAG-$TAR_FILE_NAME_GLOBAL"

  artifacts:
    paths:
      - $TAR_FILE_DIR
    expire_in: 1 hour

check:build:staging:
  extends: .check:build
  variables:
    TAG: staging

# load the latest trivy image and save as artifact for reuse
security:prepare:
  stage: security
  image: docker:latest
  dependencies: []
  services:
  - name: registry.blitzhub.io/docker:dind
    alias: docker
  before_script:
    - mkdir -p $TAR_FILE_DIR
    - *docker_login
  script:
    - docker pull aquasec/trivy:latest
    - docker tag aquasec/trivy:latest $TRIVY_IMAGE
    - docker save -o $TAR_FILE_DIR$TRIVY_TAR $TRIVY_IMAGE
    - echo "Trivy image created at $TAR_FILE_DIR$TRIVY_TAR"

  artifacts:
    paths:
      - $TAR_FILE_DIR
    expire_in: 1 hour


.security:licenses:
  stage: security
  dependencies:
    - check:build:staging
    - security:prepare
  needs:
    - check:build:staging
    - security:prepare
  image: docker:latest
  allow_failure: true
  services:
  - name: registry.blitzhub.io/docker:dind
    alias: docker
  before_script:
    - *docker_login
    - *load_target_image
    - *load_trivy_image
  script:
    # scan image for license issues to generate full report and filter for HIGH,CRITICAL report
    - docker run -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/Library/Caches:/root/.cache/ -v $PWD:/target $TRIVY_IMAGE
      image --scanners license --exit-code 0 --cache-dir .trivycache/ --format json -o target/trivy-$REPORT_NAME-full-report.json $CI_IMAGE

    # format reports to html and junit and fail if HIGH,CRITICAL issues are found
    # currently license scanning does not suppor junit and html output -> they are always empty.
    - *format_report

  artifacts:
    <<: *export_reports

security:licenses:local:staging:
  extends: .security:licenses
  variables:
    CI_IMAGE: $CI_LOCAL_IMAGE_STAGING
    REPORT_NAME: license-local-staging
    TAR_FILE_NAME: $TAR_FILE_NAME_LOCAL
    TAG: staging

security:licenses:global:staging:
  extends: .security:licenses
  variables:
    CI_IMAGE: $CI_GLOBAL_IMAGE_STAGING
    REPORT_NAME: license-global-staging
    TAR_FILE_NAME: $TAR_FILE_NAME_GLOBAL
    TAG: staging

security:filesystem:
  stage: security
  dependencies:
    - security:prepare
  needs:
    - security:prepare
  variables:
    REPORT_NAME: fs
  image: docker:latest
  allow_failure: true
  services:
  - name: registry.blitzhub.io/docker:dind
    alias: docker
  before_script:
    - *docker_login
    - *load_trivy_image
  script:
    # scan filesystem for misconfig,secret,vuln
    - docker run -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/Library/Caches:/root/.cache/ -v $PWD:/target $TRIVY_IMAGE filesystem
      --scanners misconfig,secret,vuln --exit-code 0 --cache-dir .trivycache/ --format json -o target/trivy-$REPORT_NAME-full-report.json target

    # format reports to html and junit and fail if HIGH,CRITICAL issues are found
    - *format_report

  artifacts:
    <<: *export_reports

.security:images:
  stage: security
  dependencies:
    - check:build:staging
    - security:prepare
  needs:
    - check:build:staging
    - security:prepare
  image: docker:latest
  services:
    - name: registry.blitzhub.io/docker:dind
      alias: docker
  before_script:
    - *docker_login
    - *load_target_image
    - *load_trivy_image
  script:
    # scan image for license issues to generate full report and filter for HIGH,CRITICAL report
    - docker run -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/Library/Caches:/root/.cache/ -v $PWD:/target $TRIVY_IMAGE
      image --exit-code 0 --cache-dir .trivycache/ --no-progress --format json -o target/trivy-$REPORT_NAME-full-report.json
      $CI_IMAGE
    # format reports to html and junit and fail if HIGH,CRITICAL issues are found
    - *format_report

  artifacts:
    <<: *export_reports

security:images:local:staging:
  extends: .security:images
  variables:
    CI_IMAGE: $CI_LOCAL_IMAGE_STAGING
    REPORT_NAME: image-local-staging
    TAR_FILE_NAME: $TAR_FILE_NAME_LOCAL
    TAG: staging

security:images:global:staging:
  extends: .security:images
  allow_failure: true
  variables:
    CI_IMAGE: $CI_GLOBAL_IMAGE_STAGING
    REPORT_NAME: image-global-staging
    TAR_FILE_NAME: $TAR_FILE_NAME_GLOBAL
    TAG: staging

deploy:gitlab_registry:local:staging:
  image: docker:latest
  stage: deploy
  only:
    - develop
    - master
    - main
  services:
    - name: registry.blitzhub.io/docker:dind
      alias: docker
  before_script:
    - *docker_login
    - *docker_buildx
  script:
    # we rebuild and push the database and the API image
    - docker buildx build --platform linux/amd64,linux/arm64/v8 -t $CI_LOCAL_IMAGE_STAGING -f ./Dockerfile.local --push .

deploy:gitlab_registry:global:staging:
  image: docker:latest
  stage: deploy
  only:
    - develop
    - master
    - main
  services:
    - name: registry.blitzhub.io/docker:dind
      alias: docker
  before_script:
    - *docker_login
    - *docker_buildx
  script:
    # we rebuild and push the database and the API image
    - docker buildx build --platform linux/amd64,linux/arm64/v8 -t $CI_GLOBAL_IMAGE_STAGING -f ./Dockerfile.global --push .


deploy:gitlab_registry:local:prod:
  image: docker:latest
  stage: deploy
  only:
    - develop
    - master
    - main
  services:
    - name: registry.blitzhub.io/docker:dind
      alias: docker
  before_script:
    - *docker_login
    - *docker_buildx
  script:
    # we rebuild and push the database and the API image
    - docker buildx build --platform linux/amd64,linux/arm64/v8 -t $CI_LOCAL_IMAGE_PROD -t $CI_LOCAL_IMAGE_LATEST -f ./Dockerfile.local --push .

deploy:gitlab_registry:global:prod:
  image: docker:latest
  stage: deploy
  only:
    - develop
    - master
    - main
  services:
    - name: registry.blitzhub.io/docker:dind
      alias: docker
  before_script:
    - *docker_login
    - *docker_buildx
  script:
    # we rebuild and push the database and the API image
    - docker buildx build --platform linux/amd64,linux/arm64/v8 -t $CI_GLOBAL_IMAGE_PROD -t $CI_GLOBAL_IMAGE_LATEST -f ./Dockerfile.global --push .

