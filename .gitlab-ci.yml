include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Jobs/Code-Intelligence.gitlab-ci.yml

stages:
  - dependencies
  - assemble
  - check
  - test
  - security
  - deploy

variables:
  # GitLab registry base images without tags
  CI_LOCAL_IMAGE_DIABETES: $CI_REGISTRY/$CI_PROJECT_PATH/local-daibetes
  CI_LOCAL_IMAGE_MICROBAIOME: $CI_REGISTRY/$CI_PROJECT_PATH/local-microbaiome
  CI_LOCAL_IMAGE_FLNET: $CI_REGISTRY/$CI_PROJECT_PATH/local-fl-net

  CI_GLOBAL_IMAGE_DIABETES: $CI_REGISTRY/$CI_PROJECT_PATH/global-daibetes
  CI_GLOBAL_IMAGE_MICROBAIOME: $CI_REGISTRY/$CI_PROJECT_PATH/global-microbaiome
  CI_GLOBAL_IMAGE_POSYMED: $CI_REGISTRY/$CI_PROJECT_PATH/global-posymed
  CI_GLOBAL_IMAGE_FL_NET: $CI_REGISTRY/$CI_PROJECT_PATH/global-fl-net

  # GHCR base images without tags
  GHCR_LOCAL_IMAGE_DIABETES: ghcr.io/fedlearnnet/frontend/local-daibetes
  GHCR_LOCAL_IMAGE_MICROBAIOME: ghcr.io/fedlearnnet/frontend/local-microbaiome
  GHCR_LOCAL_IMAGE_FLNET: ghcr.io/fedlearnnet/frontend/local-fl-net

  GHCR_GLOBAL_IMAGE_DIABETES: ghcr.io/fedlearnnet/frontend/global-daibetes
  GHCR_GLOBAL_IMAGE_MICROBAIOME: ghcr.io/fedlearnnet/frontend/global-microbaiome
  GHCR_GLOBAL_IMAGE_POSYMED: ghcr.io/fedlearnnet/frontend/global-posymed
  GHCR_GLOBAL_IMAGE_FL_NET: ghcr.io/fedlearnnet/frontend/global-fl-net

  # GitLab staging images
  CI_LOCAL_IMAGE_DIABETES_STAGING: $CI_LOCAL_IMAGE_DIABETES:staging
  CI_LOCAL_IMAGE_MICROBAIOME_STAGING: $CI_LOCAL_IMAGE_MICROBAIOME:staging
  CI_LOCAL_IMAGE_FL_NET_STAGING: $CI_LOCAL_IMAGE_FLNET:staging

  CI_GLOBAL_IMAGE_DIABETES_STAGING: $CI_GLOBAL_IMAGE_DIABETES:staging
  CI_GLOBAL_IMAGE_MICROBAIOME_STAGING: $CI_GLOBAL_IMAGE_MICROBAIOME:staging
  CI_GLOBAL_IMAGE_POSYMED_STAGING: $CI_GLOBAL_IMAGE_POSYMED:staging
  CI_GLOBAL_IMAGE_FL_NET_STAGING: $CI_GLOBAL_IMAGE_FL_NET:staging
  CI_GLOBAL_IMAGE_FL_NET_STAGING_RELATIVE: $CI_GLOBAL_IMAGE_FL_NET:staging-relative
  CI_LOCAL_IMAGE_FL_NET_STAGING_LOCALHOST: $CI_LOCAL_IMAGE_FLNET:staging-localhost

  # GitLab latest images
  CI_LOCAL_IMAGE_DIABETES_LATEST: $CI_LOCAL_IMAGE_DIABETES:latest
  CI_LOCAL_IMAGE_MICROBAIOME_LATEST: $CI_LOCAL_IMAGE_MICROBAIOME:latest
  CI_LOCAL_IMAGE_FL_NET_LATEST: $CI_LOCAL_IMAGE_FLNET:latest
  CI_GLOBAL_IMAGE_DIABETES_LATEST: $CI_GLOBAL_IMAGE_DIABETES:latest
  CI_GLOBAL_IMAGE_MICROBAIOME_LATEST: $CI_GLOBAL_IMAGE_MICROBAIOME:latest
  CI_GLOBAL_IMAGE_POSYMED_LATEST: $CI_GLOBAL_IMAGE_POSYMED:latest
  CI_GLOBAL_IMAGE_FL_NET_LATEST: $CI_GLOBAL_IMAGE_FL_NET:latest

  # GHCR staging images
  GHCR_LOCAL_IMAGE_DIABETES_STAGING: $GHCR_LOCAL_IMAGE_DIABETES:staging
  GHCR_LOCAL_IMAGE_MICROBAIOME_STAGING: $GHCR_LOCAL_IMAGE_MICROBAIOME:staging
  GHCR_LOCAL_IMAGE_FL_NET_STAGING: $GHCR_LOCAL_IMAGE_FLNET:staging

  GHCR_GLOBAL_IMAGE_DIABETES_STAGING: $GHCR_GLOBAL_IMAGE_DIABETES:staging
  GHCR_GLOBAL_IMAGE_MICROBAIOME_STAGING: $GHCR_GLOBAL_IMAGE_MICROBAIOME:staging
  GHCR_GLOBAL_IMAGE_POSYMED_STAGING: $GHCR_GLOBAL_IMAGE_POSYMED:staging
  GHCR_GLOBAL_IMAGE_FL_NET_STAGING: $GHCR_GLOBAL_IMAGE_FL_NET:staging
  GHCR_GLOBAL_IMAGE_FL_NET_STAGING_RELATIVE: $GHCR_GLOBAL_IMAGE_FL_NET:staging-relative
  GHCR_LOCAL_IMAGE_FL_NET_STAGING_LOCALHOST: $GHCR_LOCAL_IMAGE_FLNET:staging-localhost

  # GHCR latest images
  GHCR_LOCAL_IMAGE_DIABETES_LATEST: $GHCR_LOCAL_IMAGE_DIABETES:latest
  GHCR_LOCAL_IMAGE_MICROBAIOME_LATEST: $GHCR_LOCAL_IMAGE_MICROBAIOME:latest
  GHCR_LOCAL_IMAGE_FL_NET_LATEST: $GHCR_LOCAL_IMAGE_FLNET:latest
  GHCR_GLOBAL_IMAGE_DIABETES_LATEST: $GHCR_GLOBAL_IMAGE_DIABETES:latest
  GHCR_GLOBAL_IMAGE_MICROBAIOME_LATEST: $GHCR_GLOBAL_IMAGE_MICROBAIOME:latest
  GHCR_GLOBAL_IMAGE_POSYMED_LATEST: $GHCR_GLOBAL_IMAGE_POSYMED:latest
  GHCR_GLOBAL_IMAGE_FL_NET_LATEST: $GHCR_GLOBAL_IMAGE_FL_NET:latest

  GITLAB_ADVANCED_SAST_ENABLED: "true"
  GIT_DEPTH: "0"
  CS_IMAGE: $CI_LOCAL_IMAGE_DIABETES_LATEST

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - /root/.cache/Cypress

.docker_login: &docker_login
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.docker_login_ghcr: &docker_login_ghcr
  - test -n "$GITHUB_USERNAME" || (echo "GITHUB_USERNAME is empty" && exit 1)
  - test -n "$GITHUB_TOKEN" || (echo "GITHUB_TOKEN is empty" && exit 1)
  - echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin

.docker_buildx: &docker_buildx
  - docker context create fedDB-context || true
  - docker buildx create --name fedDBBuilder --use fedDB-context || docker buildx use fedDBBuilder
  - docker buildx inspect --bootstrap

.docker_buildxrm: &docker_buildxrm
  - docker buildx rm fedDBBuilder || true

#https://docs.gitlab.com/ci/jobs/job_rules/#reuse-rules-in-different-jobs
.security_default_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"
      when: on_success
    - when: manual


# ─────────────────────────────────────────────────────────────────────────────
# install

install:
  image: node:lts-alpine
  stage: dependencies
  rules:
    - when: always
  script:
    - npm install --prefer-offline
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
      - /root/.cache/Cypress

# ─────────────────────────────────────────────────────────────────────────────
# assemble

.assemble:
  image: node:lts-alpine
  stage: assemble
  needs:
    - install
  dependencies:
    - install
  script:
    - npm run $SCRIPT
  artifacts:
    paths:
      - dist
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
    policy: pull

# daibetes
assemble:global-daibetes:
  extends: .assemble
  variables:
    SCRIPT: build-global-dAIbetes
  only:
    - master
    - main
    - develop

assemble:global-daibetes-staging:
  extends: .assemble
  variables:
    SCRIPT: build-global-dAIbetes-staging
  only:
    - master
    - main
    - develop

assemble:local-daibetes:
  extends: .assemble
  variables:
    SCRIPT: build-local-dAIbetes
  only:
    - master
    - main
    - develop

assemble:local-daibetes-staging:
  extends: .assemble
  variables:
    SCRIPT: build-local-dAIbetes-staging
  only:
    - master
    - main
    - develop

# Posymed - only needs global prod
assemble:posymed:
  extends: .assemble
  variables:
    SCRIPT: build-posymed
  only:
    - master
    - main

assemble:posymed-staging:
  extends: .assemble
  variables:
    SCRIPT: build-posymed-staging
  only:
    - develop

# microbaiome
assemble:global-microbaiome:
