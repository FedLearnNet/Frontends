  variables:
    SCRIPT: build-local-microbAIome
  only:
    - master
    - main
    - develop

assemble:local-microbaiome-staging:
  extends: .assemble
  variables:
    SCRIPT: build-local-microbAIome-staging
  only:
    - master
    - main
    - develop

# FL-Net
assemble:global-fl-net:
  extends: .assemble
  only:
    - master
    - main
    - develop
  variables:
    SCRIPT: build-global-fl-net

assemble:global-fl-net-staging:
