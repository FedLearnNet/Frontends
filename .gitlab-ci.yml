# ─────────────────────────────────────────────────────────────────────────────
# test
test:e2e:local:
  image: cypress/browsers:22.15.0
  stage: test
  allow_failure: true
  script:
    - npm ci
    - npm run cy:local:automatic
  artifacts:
    when: always
    paths:
      - results
    expire_in: 1 day
    reports:
      junit:
        - results/junit/*.xml

test:e2e:global:
  image: cypress/browsers:22.15.0
  stage: test
  allow_failure: true
  script:
    - npm ci
    - npm run cy:global:automatic
  artifacts:
    when: always
    paths:
      - results
    expire_in: 1 day
    reports:
      junit:
        - results/junit/*.xml

# ─────────────────────────────────────────────────────────────────────────────
# deploy

.deploy:gitlab_registry:
  image: docker:24.0.2
  stage: deploy
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - *docker_login
    - *docker_buildx
  script:
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_IMAGE -f ./Dockerfile --push .

.deploy:github_registry:
  image: docker:24.0.2
  stage: deploy
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - *docker_login_ghcr
    - *docker_buildx
  script:
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_IMAGE -f ./Dockerfile --push .

