# ─────────────────────────────────────────────────────────────────────────────
# check

.check:lint:
  stage: check
  image: node:lts-alpine
  needs:
    - install
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
    policy: pull
  script:
    - npm run $SCRIPT

check:lint:local:
  extends: .check:lint
  variables:
    SCRIPT: lint-local

check:lint:shared:
  extends: .check:lint
  variables:
    SCRIPT: lint-shared-lib

check:lint:global:
  extends: .check:lint
  variables:
    SCRIPT: lint-global

.check:build:
  image: docker:24.0.2
  stage: check
  services:
    - name: docker:24.0.2-dind
      alias: docker
  before_script:
    - *docker_login
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  script:
    - docker build -t $CI_IMAGE -f ./Dockerfile .
    - docker save -o $TAR_FILE_NAME $CI_IMAGE
    - chmod 644 $TAR_FILE_NAME
    - echo "API image created at $TAR_FILE_NAME"
  artifacts:
    paths:
      - $TAR_FILE_NAME
    expire_in: 1 hour

# Daibetes
check:build:local:diabetes-staging:
  extends: .check:build
  dependencies:
    - assemble:local-daibetes
  needs:
    - assemble:local-daibetes
