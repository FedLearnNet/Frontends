<mat-card class="side-card" [class.selected]="selected">
  <mat-card-header>
    <div mat-card-avatar class="side-card-index"> {{ data.index + 1 }}.</div>
    <mat-card-title *ngIf="data.title">{{ data.title }}</mat-card-title>
    <div class="side-card-config">
      <button mat-icon-button *ngIf="editable" class="side-card-edit" (click)="onEditClick()">
        <mat-icon class="side-card-edit-hover">border_color</mat-icon>
        <mat-icon class="side-card-edit-default">edit</mat-icon>
      </button>
      <mat-icon *ngIf="draggable">drag_indicator</mat-icon>
    </div>
  </mat-card-header>
  <mat-card-content *ngIf="data.content" [innerHTML]="data.content"></mat-card-content>
</mat-card>
