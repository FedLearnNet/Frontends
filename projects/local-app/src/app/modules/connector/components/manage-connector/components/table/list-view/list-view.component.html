<h2 mat-dialog-title>List view for {{ data.name }}</h2>
<mat-dialog-content class="list-wrapper">
  <mat-list role="list">

    <ng-container *ngFor="let item of data.list; let i = index">
      <mat-list-item role="listitem" >
        <div class="list-item">
          <strong>{{ i + 1 }}</strong>
          <span>{{ item }}</span>
        </div>
      </mat-list-item>

    </ng-container>
  </mat-list>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="true">Close</button>
</mat-dialog-actions>
