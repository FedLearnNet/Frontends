<mat-dialog-content>
  <mat-card class="example-card">
    <mat-card-header>
      <mat-icon mat-card-avatar>code</mat-icon>
      <mat-card-title>Edit Selector</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>
        Specify a column to extract from your data file.
        Each selector specified will result in a new column in your Preview table.
      </p>
      <mat-divider></mat-divider>
      <p>Orginal name: {{ data.columnName }}</p>
      <p>Old name: {{ data.renamedColumn }}</p>
      <mat-divider></mat-divider>
      <mat-form-field class="example-full-width">
        <mat-label>New Name</mat-label>
        <input matInput placeholder="Name" [(ngModel)]="newName">
      </mat-form-field>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>


<mat-dialog-actions align="end">
  <button mat-button (click)="onNoClick()">Cancel</button>
  @if (data.deleted) {
    <button mat-flat-button (click)="onShowClick()">Restore</button>
  } @else {
    <button mat-flat-button (click)="onDeleteClick()">Delete</button>
  }
  <button mat-raised-button (click)="onSaveClick()">Save</button>
</mat-dialog-actions>
