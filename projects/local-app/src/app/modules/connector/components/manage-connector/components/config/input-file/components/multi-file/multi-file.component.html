<h2 mat-dialog-title>Upload Files</h2>
<mat-dialog-content>
  <div
    class="drop-zone"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (click)="triggerFileInput()"
  >
    <p>Drag and drop files here or click to select files</p>
    <input #fileInput type="file" multiple (change)="onFileChange($event)" hidden>
  </div>

  <div *ngFor="let file of files" class="file-item">
    <p>{{ file.name }}</p>
    <button mat-icon-button (click)="removeFile(file)">
      <mat-icon>clear</mat-icon>
    </button>
    <mat-progress-bar mode="determinate" [value]="progress[file.name]"></mat-progress-bar>
  </div>

  <mat-divider></mat-divider>
  @if (existingFiles.length > 0) {
    <h3>Existing Files</h3>
    <div *ngFor="let file of existingFiles" class="file-item">
      <p>{{ file }}</p>
      <button mat-icon-button (click)="removeExistingFile(file)">
        <mat-icon>clear</mat-icon>
      </button>
    </div>
  }

</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="dialogRef.close()">Cancel</button>
  @if (files.length > 0) {
    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
      <button mat-raised-button color="warn" type="button" (click)="clearAllFiles()">
        Clear All
      </button>
      <button mat-raised-button color="primary" type="submit">
        Upload
      </button>

    </form>
  }
</mat-dialog-actions>
