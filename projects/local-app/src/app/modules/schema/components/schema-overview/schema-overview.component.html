<lib-header
  [title]="'MENU.SCHEMA' | translate"
  description="Browse the global data schemas available on this node.">
</lib-header>

<lib-page-wrapper [isEmpty]="schemas().length === 0">
  <mat-table [dataSource]="schemas()" class="mat-elevation-z0">

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>{{ 'GRID.NAME' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <a [routerLink]="[element.globalId]" class="schema-link">
          <mat-icon>account_tree</mat-icon>
          {{ element.name }}
        </a>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef>{{ 'GRID.DESCRIPTION' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let element">{{ element.description }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="version">
      <mat-header-cell *matHeaderCellDef class="num-cell">{{ 'GRID.VERSION' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let element" class="num-cell">v{{ element.globalVersion }}</mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns" />
    <mat-row class="clickable-row" *matRowDef="let row; columns: displayedColumns;" />
  </mat-table>
</lib-page-wrapper>
