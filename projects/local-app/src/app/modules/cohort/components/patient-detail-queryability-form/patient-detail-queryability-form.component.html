<div class="dialog">
    <h1 mat-dialog-title class="dialog--header">
        Patients detail queryability
    </h1>

    <mat-divider />

    <div mat-dialog-content class="dialog--content">
        <form [formGroup]="queryabilityFormGroup">
            <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="patient-detail-tree">

                <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle>
                    <div class="name-row">
                        <p>
                            {{ node.name }}
                        </p>
                        <mat-form-field>
                            <mat-label>Queryability</mat-label>
                            <mat-select [formControlName]="node.id">
                                <mat-option *ngFor="let queryabilityOption of queryabilityOptions" [value]="queryabilityOption.value">
                                    {{ queryabilityOption.label }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </mat-tree-node>

                <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                    <div class="mat-tree-node">
                        <button mat-icon-button matTreeNodeToggle
                                [attr.aria-label]="'Toggle ' + node.name">
                            <mat-icon class="mat-icon-rtl-mirror">
                                {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
                            </mat-icon>
                        </button>
                        <div class="name-row">
                            <p>
                                {{node.name}}
                            </p>
                        </div>
                    </div>
                    <div [class.patient-detail-tree-invisible]="!treeControl.isExpanded(node)"
                         role="group">
                        <ng-container matTreeNodeOutlet></ng-container>
                    </div>
                </mat-nested-tree-node>
            </mat-tree>
        </form>
    </div>

    <mat-divider />

    <div mat-dialog-actions class="dialog--footer">
        <button mat-raised-button color="secondary" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" (click)="onSubmit()">Submit patient detail queryability</button>
    </div>
</div>
