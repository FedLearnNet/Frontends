<div class="dialog">
    <h1 mat-dialog-title class="dialog--header">
        {{ 'GRID.GRID_SETTINGS' | translate }}
    </h1>

    <mat-divider />

    <div mat-dialog-content class="dialog--content">
        <mat-tree
                [dataSource]="dataSource"
                [childrenAccessor]="childrenAccessor"
                [trackBy]="trackNode"
                class="patient-detail-grid-tree"
        >
            <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding #treeItem="matTreeNode">
                @if (hasChild(0, node)) {
                    <button
                            mat-icon-button
                            matTreeNodeToggle
                            [attr.aria-label]="'toggle ' + node.name"
                    >
                        <mat-icon class="mat-icon-rtl-mirror">
                            {{ treeItem.isExpanded ? 'expand_more' : 'chevron_right' }}
                        </mat-icon>
                    </button>
                } @else {
                    <button mat-icon-button disabled></button>
                }

                @if (hasChild(0, node)) {
                    <mat-checkbox
                            color="primary"
                            [disabled]="isDisabled(node)"
                            [checked]="descendantsAllSelected(node)"
                            [indeterminate]="descendantsPartiallySelected(node)"
                            (change)="dynamicColumnSelectionToggle(node, $event.checked)"
                    >
                        {{ node.name }}
                    </mat-checkbox>
                } @else {
                    <mat-checkbox
                            color="primary"
                            [disabled]="isDisabled(node)"
                            [checked]="checklistSelection.isSelected(node)"
                            (change)="dynamicColumnLeafItemSelectionToggle(node, $event.checked)"
                    >
                        {{ node.name }}
                    </mat-checkbox>
                }
            </mat-tree-node>
        </mat-tree>
    </div>

    <mat-divider />

    <div mat-dialog-actions class="dialog--footer">
        <button mat-raised-button color="secondary" (click)="onCancel()">{{ 'BUTTON.CANCEL' | translate }}</button>
        <button mat-raised-button color="primary" (click)="onSubmit()">{{ 'BUTTON.SUBMIT' | translate }}</button>
    </div>
</div>
