<lib-header
  [title]="'SCHEMA' | translate"
  description="Review the stored cohort schema as a table or hierarchy.">
  <div suffix class="state-toggle">
    <mat-button-toggle-group [(ngModel)]="viewState">
      <mat-button-toggle value="table" [matTooltip]="('TOOLTIP.SHOW_SCHEMA_IN_TABLE_VIEW' | translate)">
        <mat-icon>table</mat-icon>
      </mat-button-toggle>
      <mat-button-toggle value="diagram" [matTooltip]="('TOOLTIP.SHOW_SCHEMA_IN_TREE_VIEW' | translate)">
        <mat-icon>lan</mat-icon>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</lib-header>

<lib-page-wrapper>
  @if (viewState() === "table") {
    <table mat-table [dataSource]="flatRows()" class="mat-elevation-z0">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
          <span [style.paddingLeft.px]="40">{{ 'GRID.NAME' | translate }}</span>
        </th>
        <td mat-cell *matCellDef="let row">
          <div style="display: flex; align-items: center;">
            <button
              mat-icon-button
              [style.visibility]="row.expandable ? '' : 'hidden'"
              [style.marginLeft.px]="row.level * 32"
              (click)="toggle(row)"
              aria-label="toggle"
            >
              <mat-icon class="mat-icon-rtl-mirror">
                @if (isExpanded(row)) {
                  expand_more
                } @else {
                  chevron_right
                }
              </mat-icon>
            </button>
            {{ row.name }}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>{{ 'GRID.DESCRIPTION' | translate }}</th>
        <td mat-cell *matCellDef="let row">{{ row.description }}</td>
      </ng-container>

      <ng-container matColumnDef="dataType">
        <th mat-header-cell *matHeaderCellDef>{{ 'GRID.DATA_TYPE' | translate }}</th>
        <td mat-cell *matCellDef="let row">
          {{ row.dataType }}

          @if (row.dataType && row.dataTypeDescription) {
            <mat-icon [matTooltip]="row.dataTypeDescription">info</mat-icon>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row" class="schema-detail__actions">
          <lib-btn
            type="CUSTOM"
            icon="visibility"
            [iconOnly]="true"
            variant="GHOST"
            ariaLabel="Open schema node details"
            (clicked)="openSchemaNodeDetail(row.node)">
          </lib-btn>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>
    </table>
  } @else {
    <app-schema-detail-tree [root]="schema()" (nodeSelected)="openSchemaNodeDetail($event)" />
  }
</lib-page-wrapper>
