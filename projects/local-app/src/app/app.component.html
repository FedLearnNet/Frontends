<div class="layout" [class.has-scrim]="!menuCollapsed()">
  <lib-sidenav
    [title]="title"
    [(collapsed)]="menuCollapsed"
    [sections]="sections()"
    [starredIds]="starredIds()"
    (starToggle)="onStarToggle($event)">
  </lib-sidenav>

  <main class="content">
    <header class="topbar">
      <div class="topbar-left">
        <app-lib-breadcrumb />
      </div>

      <div class="topbar-right">
        <button type="button" class="search" (click)="openSearch()">
          <mat-icon class="search-icon">search</mat-icon>
          <span class="search-placeholder">Search cohorts, patients, schemas…</span>
          <span class="search-kbd">⌘K</span>
        </button>

        <button mat-icon-button class="home-btn" aria-label="Home" routerLink="/">
          <mat-icon>home</mat-icon>
        </button>

        <button mat-icon-button class="notification-btn" aria-label="Notifications" (click)="openNotifications()">
          <mat-icon>{{ unreadCount() > 0 ? 'notifications_active' : 'notifications_none' }}</mat-icon>
          @if (unreadCount() > 0) {
            <span class="notification-count">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
          }
        </button>

        <app-lib-user-menu />
      </div>
    </header>

    <div class="content-body">
      <router-outlet />
    </div>
  </main>

  <div class="scrim" (click)="onToggle()"></div>
</div>

<app-lib-footer
  [brand]="project"
  tagline="Clinical-grade, reproducible federated learning at the clinic node."
  [groups]="footerGroups"
  [githubLabel]="null"
/>
