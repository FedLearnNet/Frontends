<div class="models">
  @if (!forAppId) {
    <h2>Your Models</h2>
  }
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
  </mat-form-field>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID</th>
        <td mat-cell *matCellDef="let row">
          <a [routerLink]="['/model',row.id]">{{ row.id }}</a></td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name</th>
        <td mat-cell *matCellDef="let row"> {{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="publishStatus">
        <th mat-header-cell *matHeaderCellDef> Publish Status</th>
        <td mat-cell *matCellDef="let row"> {{ row.publishStatus }}</td>
      </ng-container>

      <ng-container matColumnDef="shortDescription">
        <th mat-header-cell *matHeaderCellDef> Description</th>
        <td mat-cell *matCellDef="let row"> {{ row.shortDescription }}</td>
      </ng-container>

      @if (!forAppId) {
        <ng-container matColumnDef="appId">
          <th mat-header-cell *matHeaderCellDef> App ID</th>
          <td mat-cell *matCellDef="let row">
            <a [routerLink]="['/app', row.federatedApp.id]">{{ row.federatedApp.id }}</a></td>
        </ng-container>
        <ng-container matColumnDef="appName">
          <th mat-header-cell *matHeaderCellDef> App Name</th>
          <td mat-cell *matCellDef="let row"> {{ row.federatedApp.name }}</td>
        </ng-container>
      }
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
