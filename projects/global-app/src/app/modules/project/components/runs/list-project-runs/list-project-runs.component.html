<section>
  <mat-toolbar>
    <span class="spacer"></span>
    <button mat-raised-button (click)="newRun()">
      <mat-icon>add</mat-icon>
      <span>{{ (kind() === 'federated' ? 'BUTTON.CREATE_EXPERIMENT' : 'BUTTON.CREATE_LOCAL_EXPERIMENT') | translate }}</span>
    </button>
  </mat-toolbar>

  <table mat-table [dataSource]="runs()" class="mat-elevation-z0">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.NAME' | translate }}</th>
      <td mat-cell *matCellDef="let run">
        <a [routerLink]="['experiments', kind(), run.id]">
          {{ run.experiment?.name ?? run.name }}
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.DESCRIPTION' | translate }}</th>
      <td mat-cell *matCellDef="let run"> {{ run.experiment?.description }}</td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.TIME' | translate }}</th>
      <td mat-cell *matCellDef="let run">
        @if (run.finishedAt) {
          <lib-time-badge [date]="run.finishedAt"/>
        } @else {
          <lib-time-badge [date]="run.startedAt ?? run.createdAt"/>
          @if (run.startedAt) {
            <lib-time-badge [date]="run.startedAt" [calcDuration]="true"/>
          }
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.STATUS' | translate }}</th>
      <td mat-cell *matCellDef="let run">
        @let status = statusOf(run);
        <lib-status-badge [text]="status.text" [type]="status.type" size="SMALL" [animate]="true"/>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</section>
