@if (step(); as step) {
  <lib-status-title [type]="runStatusToBadgeStatus(step.status)">
    #{{ node.nodeId }} {{ name }}
  </lib-status-title>
  <mat-dialog-content>
    @if (experimentData(); as data) {
      <lib-experiment-workflow-node-detail [experimentData]="data"
                                           [hideMetric]="isTest()"
                                           [hideOutput]="isTest()"
                                           [hideInput]="isTest()"/>
    } @else {
      <p>{{ 'NO_RESULT' | translate }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onNoClick()">{{ 'BUTTON.CLOSE' | translate }}</button>
  </mat-dialog-actions>
}
