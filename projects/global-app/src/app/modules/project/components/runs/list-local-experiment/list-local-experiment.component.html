<section>
  <mat-toolbar>
    <span class="spacer"></span>
    <button mat-raised-button
            aria-label="Create new local experiment"
            (click)="newExperiment()"
    >
      <mat-icon>add</mat-icon>
      <span>{{ 'BUTTON.CREATE_LOCAL_EXPERIMENT' | translate }}</span>
    </button>
  </mat-toolbar>


  @if (filteredExperiments(); as exs) {
    <table mat-table [dataSource]="exs" class="mat-elevation-z0">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ 'GRID.NAME' | translate }}</th>
        <td mat-cell *matCellDef="let project">
          <a [routerLink]="['experiments','local', project.id]">
            {{ project.name }}
          </a>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>{{ 'GRID.DESCRIPTION' | translate }}</th>
        <td mat-cell *matCellDef="let project"> {{ project.description }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>{{ 'GRID.TIME' | translate }}</th>
        <td mat-cell *matCellDef="let project">
          @if (project.finishedAt) {
            <lib-time-badge [date]="project.finishedAt" />
          } @else {
            <lib-time-badge [date]="project.startedAt" />
            @if (project.startedAt) {
              <lib-time-badge [date]="project.startedAt" [calcDuration]="true" />
            }
          }
        </td>
      </ng-container>


      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>{{ 'GRID.STATUS' | translate }}</th>
        <td mat-cell *matCellDef="let project">
          <lib-status-badge [text]="project.experimentStatus"
                            [type]="projectStatusToBadgeStatus(project.experimentStatus)"
                            size="SMALL"
                            [animate]="true" />
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</section>
