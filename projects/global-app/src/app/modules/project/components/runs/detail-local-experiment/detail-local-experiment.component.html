@if (run(); as run) {
  @if (selectedWorkflow(); as wf) {
    <div class="wrapper">
      <div class="head">
        <app-experiment-header [run]="run"
                               (startExperiment)="start()"
                               (stop)="stop()"
                               (refresh)="reload()"
                               [isSSEConnected]="connected()"
                               [loading]="loading()"/>
      </div>
      <lib-workflow-readonly-view
        class="detail"
        [workflow]="wf"
        [run]="run"
        (selectNode)="showDetail($event)"
      ></lib-workflow-readonly-view>
    </div>
  } @else {
    <lib-skeleton-loader/>
  }
} @else {
  <lib-skeleton-loader/>
}
