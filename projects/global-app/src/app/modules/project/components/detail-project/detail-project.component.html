@if (project) {

  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start"
                 [(selectedIndex)]="selectedIndex" (selectedTabChange)="onTabChange($event)">
    <mat-tab label="Overview">
      <app-detail-project-overview [(project)]="project"></app-detail-project-overview>
    </mat-tab>
    <mat-tab label="Data">
      <app-create-datasets [(project)]="project"></app-create-datasets>
    </mat-tab>
    <mat-tab label="Workflow">
      <app-detail-project-workflow [project]="project"></app-detail-project-workflow>
    </mat-tab>
    <mat-tab label="Run">
      <app-project-runs [project]="project"></app-project-runs>
    </mat-tab>
    <mat-tab label="Bootstrap"> Content 3</mat-tab>

  </mat-tab-group>
}
