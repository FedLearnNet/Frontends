<mat-toolbar>
  <button mat-icon-button (click)="backClicked()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>  {{ app?.name }}</span>
  <span class="spacer"></span>
  @if (app) {
    <button mat-icon-button class="example-icon" aria-label="Example icon-button with share icon">
      <mat-icon>share</mat-icon>
    </button>
  }
</mat-toolbar>


<div class="app">
  @if (app) {
    <app-app-header [app]="app"></app-app-header>

    <div class="app--body">
      <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
        <mat-tab label="Description">
          <markdown [data]="app.longDescription"></markdown>
        </mat-tab>
        <mat-tab label="Config">
          <app-app-config [config]="app.appConfig">
          </app-app-config>

        </mat-tab>
        <mat-tab label="App Versions">
          <app-app-version-list [app]="app" (selectedVersion)="versionChanged($event)"></app-app-version-list>
        </mat-tab>
        <mat-tab label="Reviews">
          <app-app-reviews [app]="app" ></app-app-reviews>
        </mat-tab>
        <mat-tab label="Statistics">
          TODO Which statistics should be shown here?
        </mat-tab>
        <mat-tab label="Workflow Templates">
          TODO Are workflow templates still a thing?
        </mat-tab>
      </mat-tab-group>
    </div>
  }
</div>
