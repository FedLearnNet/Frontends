<h2 mat-dialog-title>Publish new Version for {{data.name}}</h2>
<mat-dialog-content>
  <mat-icon class="warning">error</mat-icon>
  <h3>Are you sure?</h3>
  <p>After publish changes, a new Version will be created.</p>
  <p>You can not change the Version {{data.latestVersion}} anymore.</p>

  <mat-form-field class="full-width">
    <mat-label>Changelog</mat-label>
    <textarea matInput placeholder="Fix a bug for ..." [(ngModel)]="changelog"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
  <button mat-button (click)="publish()">Publish</button>
</mat-dialog-actions>
