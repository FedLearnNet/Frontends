<div class="pipeline-card">
  <div class="pipeline-card__header">
    <div>
      @if (pipelineStatus(); as pipelineStatus) {
        <lib-status-badge [size]="'SMALL'"
                          [type]="pipelineStatusToBadgeStatus(pipelineStatus)"/>

        <div>Pipeline #{{ pipelineId() }}</div>
      }
    </div>
    <div class="btns">
      @if (pipelineStatus(); as pipelineStatus) {
        @if (pipelineStatus === PipelineStatus.RUNNING || pipelineStatus === PipelineStatus.PENDING) {
          @if (stopClicked()) {
            <button mat-icon-button
                    [matTooltip]="'Stop current run processing'"
                    class="btn--stop"
            >
              <mat-icon>av_timer</mat-icon>
            </button>
          } @else {
            <button mat-icon-button
                    [matTooltip]="'Stop current run'"
                    (click)="stopExecution()"
                    class="btn--stop"
            >
              <mat-icon>stop_circle</mat-icon>
            </button>
          }
        }
      }
      <lib-sse-refresh-btn [btnText]="undefined"
                           [streaming]="streaming()"
                           (clicked)="refreshPipeline()"/>
    </div>
  </div>

  <div class="pipeline-card__body">
    <lib-pipeline-steps [pipeline]="pipeline()"/>
  </div>
</div>
