<lib-header
  class="header"
  title="Schemas"
  description="Review and manage global schemas"
  [enableGoBack]="true"
  [enableSearch]="true"
  [routerOnePathBack]="true"
  [enableSkeleton]="loading()"
  searchLabel="Search schemas"
  searchPlaceholder="Name"
  (searchInput)="applyFilter($event)">
  <button mat-raised-button
          suffix
          aria-label="Add new Schema"
          [routerLink]="['new']"
  >
    <mat-icon>add</mat-icon>
    <span>{{ 'BUTTON.NEW_SCHEMA' | translate }}</span>
  </button>
</lib-header>

<lib-page-wrapper>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.ID' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        <a [routerLink]="[element.id]">{{ element.id }}
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.NAME' | translate }}</th>
      <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.DESCRIPTION' | translate }}</th>
      <td mat-cell *matCellDef="let element"> {{ element.description }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">{{ 'NO_DATA_MATCHING_THE_FILTER' | translate:{filter: filterValue()} }}</td>
    </tr>
  </table>
</lib-page-wrapper>
