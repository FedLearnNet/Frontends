<h2 mat-dialog-title>{{ 'DIAGRAM_FOR' | translate: { name: data.name} }}</h2>
<mat-dialog-content>
  @if (loading) {
    <mat-spinner />
  }
  <div #cy id="cy" style="width: 100%; height: 400px;"></div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onNoClick()">{{ 'BUTTON.NO_THANKS' | translate }}</button>
  <button mat-button (click)="saveGraph()" [disabled]="!canImport">{{ 'BUTTON.IMPORT' | translate }}</button>
</mat-dialog-actions>
