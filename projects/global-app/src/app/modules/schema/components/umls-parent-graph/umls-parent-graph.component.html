<h2 mat-dialog-title>Diagram for {{ data.name }}</h2>
<mat-dialog-content>
  @if (loading) {
    <mat-spinner></mat-spinner>
  }
  <div #cy id="cy" style="width: 100%; height: 400px;"></div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onNoClick()">No Thanks</button>
  <button mat-button (click)="saveGraph()" [disabled]="!canImport">Import</button>
</mat-dialog-actions>
