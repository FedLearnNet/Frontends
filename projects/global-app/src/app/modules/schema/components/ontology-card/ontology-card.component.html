@if (ontology) {
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title> {{ ontology.name }}</mat-card-title>
      <mat-card-subtitle> {{ ontology.uniqueId }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>
        {{ ontology.desc }}
      </p>
    </mat-card-content>
    <mat-card-actions align="end">
      <a mat-button [routerLink]="['/data-modelling', 'ontology', ontology.uniqueId ]">View</a>
    </mat-card-actions>
  </mat-card>
}
