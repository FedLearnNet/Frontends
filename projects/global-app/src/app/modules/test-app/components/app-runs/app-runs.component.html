<div class="app-runs">
  <mat-tab-group>
    <mat-tab label="Local Experiments">
      <app-experiment [app]="app"
                      [appRunning]="appRunning"
                      [datafiles]="datafiles"></app-experiment>
    </mat-tab>
    <mat-tab label="Test Runs">
      <app-app-run-test [app]="app" [appRunning]="appRunning"
                        [datafiles]="datafiles"></app-app-run-test>
    </mat-tab>
  </mat-tab-group>
</div>
