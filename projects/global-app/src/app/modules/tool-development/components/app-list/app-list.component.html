<lib-header
  title="My Tools"
  description="Create, review and manage your tools"
  [enableSearch]="!isEmpty()"
  [enableAddBtn]="!isEmpty()"
  [enableSkeleton]="loading()"
  searchLabel="Search tools"
  searchPlaceholder="Names"
  addBtnLabel="New Tool"
  (addBtnClick)="createNewApp()"
  (searchInput)="applyFilter($event)">
</lib-header>
<lib-page-wrapper
  [isLoading]="loading()"
  [isEmpty]="isEmpty()"
>
  <lib-empty-state
    empty
    [title]="'You dont have any tool yet'"
    [subtitle]="'Start your first tool.'"
    [primaryButtonEnabled]="true"
    [primaryButtonLabel]="'New Tool'"
    (cta)="createNewApp()"
  ></lib-empty-state>

  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.ID' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <a [routerLink]="[row.id]">{{ row.id }}</a></td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.TYPE' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <lib-app-type-badge [type]="row.type"></lib-app-type-badge>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.NAME' | translate }}</th>
      <td mat-cell *matCellDef="let row"> {{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="publishStatus">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.PUBLISH_STATUS' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <lib-publish-badge [type]="row.publishStatus"/>
      </td>
    </ng-container>

    <ng-container matColumnDef="shortDescription">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.DESCRIPTION' | translate }}</th>
      <td mat-cell *matCellDef="let row"> {{ row.shortDescription }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">{{ 'NO_DATA_MATCHING_THE_FILTER' | translate:{filter: latestSearchValue()} }}
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"/>
</lib-page-wrapper>
