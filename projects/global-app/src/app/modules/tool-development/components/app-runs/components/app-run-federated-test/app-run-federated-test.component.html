<p>{{ 'PERFORM_FEDERATED_TEST_RUN' | translate }}</p>
<div class="test-table">
  <div class="test-table--header">
    <lib-btn
      class="add-test-btn"
      appearance="FAB_EXTENDED"
      colorVariant="PINK"
      type="CREATE"
      icon="hub"
      [disabled]="!appRunning()"
      [label]="'BUTTON.ADD_FEDERATED_TEST' | translate"
      (clicked)="addNewFederatedTest()"
    />
  </div>
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.NO' | translate }}</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ dataSource.data.length - i }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.STATUS' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        <lib-status-badge [type]="runStatusToBadgeStatus(element.status)"/>
      </td>
    </ng-container>

    <ng-container matColumnDef="participants">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.PARTICIPANTS' | translate }}</th>
      <td mat-cell *matCellDef="let element">{{ participantCount(element) }}</td>
    </ng-container>

    <ng-container matColumnDef="error">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.ERROR' | translate }}</th>
      <td mat-cell *matCellDef="let element">{{ element.error }}</td>
    </ng-container>

    <ng-container matColumnDef="startTime">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.START_TIME' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        <lib-time-badge color="GRAY" [date]="element.createdAt"></lib-time-badge>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="showDetail(row)"></tr>
  </table>
</div>
