<p>Perform your experiments</p>
<div class="test-table">
  <div class="test-table--header">
    <lib-btn
      class="add-test-btn"
      appearance="FAB_EXTENDED"
      colorVariant="PINK"
      type="CREATE"
      label="New Local Experiment"
      (clicked)="addNewExperiment()"
    />
  </div>
  <table mat-table [dataSource]="dataSource" class="">
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let element; let i = index">
        <a [routerLink]="['experiment', element.id]">
          {{ dataSource.data.length - i }}
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <lib-status-badge [type]="runStatusToBadgeStatus(element.status)"/>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{ 'GRID.NAME' | translate }}</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="startTime">
      <th mat-header-cell *matHeaderCellDef>Start Time</th>
      <td mat-cell *matCellDef="let element">{{ element.createdAt | date: 'medium' }}</td>
    </ng-container>

    <ng-container matColumnDef="lastUpdate">
      <th mat-header-cell *matHeaderCellDef>Last Update</th>
      <td mat-cell *matCellDef="let element">{{ element.updatedAt | date: 'medium' }}</td>
    </ng-container>


    <ng-container matColumnDef="appVersion">
      <th mat-header-cell *matHeaderCellDef>App Version</th>
      <td mat-cell *matCellDef="let element">{{ element.federatedAppVersionName }}</td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index"></tr>
  </table>
</div>
