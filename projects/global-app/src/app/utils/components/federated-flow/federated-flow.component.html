<section class="flow" [class.flow--playing]="playing()" [attr.data-phase]="phase()">
  <header class="flow__head">
    <div>
      <h2>How federated learning works</h2>
      <p>The model travels to the hospitals. Patient data never leaves them.</p>
    </div>
    <button type="button" class="flow__play" (click)="togglePlay()"
            [attr.aria-label]="playing() ? 'Pause animation' : 'Play animation'">
      <mat-icon>{{ playing() ? 'pause' : 'play_arrow' }}</mat-icon>
    </button>
  </header>

  <div class="flow__figure">
    <svg [attr.viewBox]="'0 0 ' + viewWidth() + ' ' + VIEW_H" role="img"
         aria-label="Hospitals train a model on their own patient data. Only encrypted weight updates go to the aggregator, which sends the new global model back.">
      <defs>
        <marker id="flf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
                orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
        </marker>
      </defs>

      <!-- Aggregator: global model (5) -->
      <g class="agg" [class.is-active]="phase() === 5">
        <rect class="agg__bar" x="16" y="16" [attr.width]="viewWidth() - 32" height="74" rx="8"/>
        <g class="agg__icon" transform="translate(56,53)">
          <line x1="-22" y1="-12" x2="0" y2="-18"/><line x1="-22" y1="-12" x2="0" y2="0"/>
          <line x1="-22" y1="12" x2="0" y2="0"/><line x1="-22" y1="12" x2="0" y2="18"/>
          <line x1="0" y1="-18" x2="22" y2="-8"/><line x1="0" y1="0" x2="22" y2="-8"/>
          <line x1="0" y1="0" x2="22" y2="8"/><line x1="0" y1="18" x2="22" y2="8"/>
          <circle cx="-22" cy="-12" r="5"/><circle cx="-22" cy="12" r="5"/>
          <circle cx="0" cy="-18" r="5"/><circle cx="0" cy="0" r="5"/><circle cx="0" cy="18" r="5"/>
          <circle cx="22" cy="-8" r="5"/><circle cx="22" cy="8" r="5"/>
        </g>
        <text class="agg__title" x="100" y="46">Aggregator: global model</text>
        <text class="agg__formula" x="100" y="72">W<tspan dy="-5" font-size="10">(t+1)</tspan><tspan dy="5"> = W</tspan><tspan dy="-5" font-size="10">(t)</tspan><tspan dy="5"> + Σ</tspan><tspan dy="3" font-size="10">k</tspan><tspan dy="-3"> (n</tspan><tspan dy="3" font-size="10">k</tspan><tspan dy="-3">/n) ΔW</tspan><tspan dy="3" font-size="10">k</tspan></text>

        @if (!compact()) {
          <text class="agg__label" x="420" y="46">Weight per site</text>
          @for (site of sites(); track site.id; let i = $index) {
            <g class="agg__chip" [attr.transform]="'translate(' + (540 + i * 112) + ',30)'" [style.--i]="i">
              <rect width="104" height="22" rx="4"/>
              <text x="52" y="15" text-anchor="middle">{{ site.label }}: {{ site.share }}</text>
            </g>
          }
          <text class="agg__sub" x="540" y="74">n<tspan dy="3" font-size="9">k</tspan><tspan dy="-3"> / n, total n = 86,500 patients</tspan></text>
        }

        <g [attr.transform]="'translate(' + (viewWidth() - 150) + ',0)'">
          <text class="agg__sub" x="0" y="48">round {{ round() }} of {{ ROUNDS }}</text>
          @for (r of roundDots; track r) {
            <circle class="agg__dot" [class.is-done]="r < round()" [attr.cx]="7 + r * 18" cy="68" r="6"/>
          }
        </g>
        <g class="num" [attr.transform]="'translate(' + (viewWidth() - 30) + ',32)'">
          <circle r="10"/><text y="4">5</text>
        </g>
      </g>

      @for (site of sites(); track site.id) {
        @let dx = downX(site);
        @let ux = upX(site);
        @let end = lineEnd(site);
        @let pillW = site.full ? 68 : 52;
        <g class="site" [attr.data-tone]="site.tone" [style.--delay]="site.delay + 'ms'">
          <rect class="site__box" [attr.x]="site.x" [attr.y]="SITE_Y" [attr.width]="site.width"
                [attr.height]="SITE_H" rx="10"/>

          <!-- Hospital -->
          <g class="site__icon" [attr.transform]="'translate(' + (site.x + 14) + ',' + (SITE_Y + 8) + ')'">
            <rect x="0" y="10" width="36" height="24" rx="2"/>
            <rect x="10" y="0" width="16" height="34" rx="2"/>
            <circle class="site__cross" cx="18" cy="10" r="6"/>
            <text class="site__h" x="18" y="13.5">H</text>
            <rect class="site__window" x="3" y="16" width="4" height="4"/><rect class="site__window" x="3" y="24" width="4" height="4"/>
            <rect class="site__window" x="29" y="16" width="4" height="4"/><rect class="site__window" x="29" y="24" width="4" height="4"/>
            <rect class="site__window" x="15" y="24" width="6" height="10"/>
          </g>
          <text class="site__name" [attr.x]="site.x + 58" [attr.y]="SITE_Y + 31">{{ site.label }}</text>

          <!-- W(t+1) down (6) and ΔW up (4), locked at the site boundary -->
          <line class="link link--down" [class.is-active]="phase() === 6"
                [attr.x1]="dx" [attr.y1]="AGG_BOTTOM" [attr.x2]="dx" [attr.y2]="end - 3" marker-end="url(#flf-arrow)"/>
          <line class="link link--up" [class.is-active]="phase() === 4"
                [attr.x1]="ux" [attr.y1]="end" [attr.x2]="ux" [attr.y2]="AGG_BOTTOM + 3" marker-end="url(#flf-arrow)"/>

          <g class="pill" [attr.transform]="'translate(' + (dx - pillW / 2) + ',100)'">
            <rect [attr.width]="pillW" height="24" rx="12"/>
            <text [attr.x]="pillW / 2" y="16.5">W<tspan dy="-4" font-size="9">(t+1)</tspan></text>
          </g>
          <g class="num" [attr.transform]="'translate(' + (dx + pillW / 2) + ',100)'"><circle r="10"/><text y="4">6</text></g>

          <g class="pill" [attr.transform]="'translate(' + (ux - pillW / 2) + ',100)'">
            <rect [attr.width]="pillW" height="24" rx="12"/>
            <text [attr.x]="pillW / 2" y="16.5">ΔW<tspan dy="3" font-size="9">{{ site.id }}</tspan></text>
          </g>
          <g class="num" [attr.transform]="'translate(' + (ux + pillW / 2) + ',100)'"><circle r="10"/><text y="4">4</text></g>

          @for (lx of [dx, ux]; track $index) {
            <g class="lock" [class.is-active]="($index === 0 && phase() === 6) || ($index === 1 && phase() === 4)"
               [attr.transform]="'translate(' + lx + ',' + SITE_Y + ')'">
              <circle r="12"/>
              <path class="lock__shackle" d="M-4,-1 v-3 a4,4 0 0 1 8,0 v3"/>
              <rect class="lock__body" x="-5.5" y="-1" width="11" height="8" rx="1.5"/>
            </g>
          }

          @if (site.full) {
            <!-- 1 Local data store -->
            <g class="card" [class.is-active]="phase() === 1"
               [attr.transform]="'translate(' + (site.x + 16) + ',' + CARD_Y + ')'">
              <text class="card__label" x="0" y="-8">Local data store</text>
              <rect class="card__box" width="120" height="176" rx="8"/>
              <g class="db" transform="translate(60,52)">
                <path d="M-22,-18 v36 a22,7 0 0 0 44,0 v-36"/>
                <ellipse cx="0" cy="-18" rx="22" ry="7"/>
                <path class="db__band" d="M-22,-6 a22,7 0 0 0 44,0 M-22,6 a22,7 0 0 0 44,0"/>
                <circle class="db__dot" cx="12" cy="-1" r="1.6"/><circle class="db__dot" cx="16" cy="-1" r="1.6"/>
                <circle class="db__dot" cx="12" cy="11" r="1.6"/><circle class="db__dot" cx="16" cy="11" r="1.6"/>
              </g>
              <text class="card__strong" x="60" y="106">Patient data</text>
              <text class="card__text" x="60" y="124">{{ site.records }} records</text>
              <text class="card__muted" x="60" y="152">Own data</text>
              <text class="card__muted" x="60" y="166">standard</text>
              <g class="num" transform="translate(116,2)"><circle r="10"/><text y="4">1</text></g>
            </g>

            <line class="link link--inner" [attr.x1]="site.x + 138" [attr.y1]="CARD_Y + 88"
                  [attr.x2]="site.x + 156" [attr.y2]="CARD_Y + 88" marker-end="url(#flf-arrow)"/>

            <!-- 2 Local training -->
            <g class="card card--train" [class.is-active]="phase() === 2"
               [attr.transform]="'translate(' + (site.x + 160) + ',' + CARD_Y + ')'">
              <text class="card__label" x="0" y="-8">Local training</text>
              <rect class="card__box" width="120" height="176" rx="8"/>
              @for (edge of netEdges; track $index) {
                <line class="nn__edge" [attr.x1]="edge.x1" [attr.y1]="edge.y1" [attr.x2]="edge.x2" [attr.y2]="edge.y2"/>
              }
              @for (node of netNodes; track $index) {
                <circle class="nn__node" [attr.data-kind]="node.kind" [style.--col]="node.col"
                        [attr.cx]="node.x" [attr.cy]="node.y" r="4.5"/>
              }
              <text class="card__small" x="10" y="92">Training loss</text>
              <path class="loss__area" d="M10,100 C40,102 52,104 64,122 S92,140 110,142 V150 H10 Z"/>
              <path class="loss" pathLength="1" d="M10,100 C40,102 52,104 64,122 S92,140 110,142"/>
              <text class="card__small" x="10" y="168">Epochs</text>
              @for (e of [0, 1, 2]; track e) {
                <rect class="epoch" [style.--e]="e" [attr.x]="56 + e * 20" y="160" width="16" height="8" rx="2"/>
              }
              <g class="num" transform="translate(116,2)"><circle r="10"/><text y="4">2</text></g>
            </g>

            <line class="link link--inner" [attr.x1]="site.x + 282" [attr.y1]="CARD_Y + 88"
                  [attr.x2]="site.x + 300" [attr.y2]="CARD_Y + 88" marker-end="url(#flf-arrow)"/>

            <!-- 3 Result -->
            <g class="card" [class.is-active]="phase() === 3"
               [attr.transform]="'translate(' + (site.x + 304) + ',' + CARD_Y + ')'">
              <text class="card__label" x="0" y="-8">Result</text>
              <rect class="card__box" width="120" height="176" rx="8"/>
              @for (cell of weightCells; track cell.i) {
                <rect class="w-cell" [style.--c]="cell.i" [attr.x]="cell.x" [attr.y]="cell.y"
                      width="18" height="14" rx="1.5" [attr.fill]="cell.fill"/>
              }
              <text class="card__text" x="60" y="124">Model weights W<tspan dy="3" font-size="9">{{ site.id }}</tspan></text>
              <g class="num" transform="translate(116,2)"><circle r="10"/><text y="4">3</text></g>
            </g>

            <!-- Records flow from the store into training (1) -->
            @for (k of recordPackets; track k) {
              <g [attr.transform]="'translate(' + (site.x + 98) + ',' + (CARD_Y + 30 + k * 12) + ')'">
                <g class="packet packet--record" [style.--k]="k" style="--tx: 72px">
                  <rect x="-6" y="-4" width="12" height="8" rx="1.5"/>
                </g>
              </g>
            }
          } @else {
            <!-- Compact site: the same three stages as one column -->
            @let cx = site.x + 70;
            <g class="mini" [class.is-active]="phase() <= 3" [attr.transform]="'translate(' + cx + ',' + (SITE_Y + 78) + ')'">
              <g class="db" transform="scale(0.75)">
                <path d="M-22,-18 v36 a22,7 0 0 0 44,0 v-36"/>
                <ellipse cx="0" cy="-18" rx="22" ry="7"/>
                <path class="db__band" d="M-22,-6 a22,7 0 0 0 44,0 M-22,6 a22,7 0 0 0 44,0"/>
              </g>
              <line class="link link--inner" x1="0" y1="20" x2="0" y2="34" marker-end="url(#flf-arrow)"/>
              <g class="card--train" transform="translate(-40,38) scale(0.66)">
                @for (edge of netEdges; track $index) {
                  <line class="nn__edge" [attr.x1]="edge.x1" [attr.y1]="edge.y1" [attr.x2]="edge.x2" [attr.y2]="edge.y2"/>
                }
                @for (node of netNodes; track $index) {
                  <circle class="nn__node" [attr.data-kind]="node.kind" [style.--col]="node.col"
                          [attr.cx]="node.x" [attr.cy]="node.y" r="4.5"/>
                }
              </g>
              <line class="link link--inner" x1="0" y1="86" x2="0" y2="100" marker-end="url(#flf-arrow)"/>
              <g transform="translate(-40,104) scale(0.66)">
                @for (cell of weightCells; track cell.i) {
                  <rect class="w-cell" [style.--c]="cell.i" [attr.x]="cell.x" [attr.y]="cell.y"
                        width="18" height="14" rx="1.5" [attr.fill]="cell.fill"/>
                }
              </g>
              <text class="card__small" x="0" y="180" text-anchor="middle">Model weights W<tspan dy="3" font-size="8">N</tspan></text>
            </g>
          }

          <!-- Patient data stays in the site -->
          <g class="stays" [attr.transform]="'translate(' + (site.x + site.width - 216) + ',' + (SITE_Y + SITE_H - 13) + ')'">
            <rect width="204" height="26" rx="13"/>
            <text x="102" y="17.5">Patient data stays in {{ site.label }}</text>
          </g>

          <!-- ΔW travels up (4), the new model W(t+1) comes down (6) -->
          <g [attr.transform]="'translate(' + ux + ',' + end + ')'">
            <g class="packet packet--up" [style.--ty]="(-travel(site)) + 'px'">
              <rect x="-17" y="-11" width="34" height="22" rx="6"/>
              <text y="4.5">ΔW</text>
            </g>
          </g>
          <g [attr.transform]="'translate(' + dx + ',' + AGG_BOTTOM + ')'">
            <g class="packet packet--down" [style.--ty]="travel(site) + 'px'">
              <rect x="-17" y="-11" width="34" height="22" rx="6"/>
              <text y="4.5">W</text>
            </g>
          </g>
        </g>
      }
    </svg>
    @if (compact()) {
      <p class="flow__note">Every other site runs the same loop at the same time.</p>
    }
  </div>

  <ol class="flow__steps">
    @for (step of steps; track step.n) {
      <li>
        <button type="button" class="step" [class.active]="step.n === phase()"
                [attr.aria-current]="step.n === phase() ? 'step' : null"
                [style.--ms]="step.ms + 'ms'" (click)="goTo(step.n)">
          <span class="step__num">{{ step.n }}</span>
          <span class="step__body">
            <strong>{{ step.title }}</strong>
            <span class="step__text">{{ step.text }}</span>
          </span>
          <span class="step__bar" aria-hidden="true"></span>
        </button>
      </li>
    }
  </ol>
</section>
