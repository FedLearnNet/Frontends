@if (noWorkflowFound()) {
  <div class="workflow-overlay">
    <lib-empty-state
      title="Create your workflow"
      subtitle="You can manage all types of applications and connect them."
      icon="not_started"
      [primaryButtonEnabled]="true"
      primaryButtonLabel="Create workflow"
      (cta)="startNewWorkflow()"
    />
  </div>
} @else {
  <lib-workflow-validation-panel class="error-panel"
                                 (isValidChange)="updateIsValid($event)"
                                 [workflow]="workflow()">
  </lib-workflow-validation-panel>
  <lib-workflow-palette
    (nodeAdded)="addNode($event)"
    (datasetAdded)="addDataset()"
    [isValid]="workflowValid()"
    [workflowId]="workflowId()"
    [isForFederatedLearning]="isForFederatedLearning()"/>

  <lib-workflow-action-panel [selectionLength]="selectionLength()"
                             [isValid]="workflowValid()"
                             (processAction)="processAction($event)"/>

  <f-flow fDraggable (fLoaded)="onLoaded()"
          [vCellSize]="100"
          [hCellSize]="50"
          (fSelectionChange)="changeSelection($event)"
          (fMoveNodes)="updateNodeMovement($event)"
          (fReassignConnection)="onConnectionDropped($event)"
          (fCreateConnection)="onConnectionCreated($event)">
    <f-background>
      <f-circle-pattern/>
    </f-background>
    <f-selection-area/>

    <f-canvas [fZoom]="true">
      <f-connection-for-create/>

      @for (connection of workflow().connections; track connection.inputId) {
        <f-connection [fReassignDisabled]="false"
                      fBehavior="fixed"
                      [fOffset]="32"
                      fType="segment"
                      [fOutputId]="connection.outputId" [fInputId]="connection.inputId">
          <svg viewBox="0 0 6 7" fMarker [type]="eMarkerType.END" class="connection-marker"
               [height]="7" [width]="6"
               [refX]="5.5" [refY]="3.5" markerUnits="strokeWidth" orient="auto">
            <path d="M0.000391006 0L6 3.5L0.000391006 7L0.000391006 0Z"/>
          </svg>

          <div fConnectionContent [position]="0.5">
            <lib-workflow-connection-content [connection]="connection"
                                             [(workflow)]="workflow"/>

          </div>
        </f-connection>
      }


      @for (node of workflow().nodes; track node.id) {
        <div fNode fDragHandle [fNodePosition]="node.position" [fNodeId]="node.nodeId">

          <lib-workflow-node-card [node]="node"
                                  [(workflow)]="workflow"
                                  (deleteNode)="deleteNode(node)"
                                  (nodeChange)="updateNode($event)"
          />

          @if (!node.extended) {
            <lib-workflow-node-connectors [(workflow)]="workflow"
                                          [inputMode]="true"
                                          [node]="node"/>

            <lib-workflow-node-connectors [(workflow)]="workflow"
                                          [node]="node"/>
          }
        </div>
      }

      @for (input of workflow().inputs; track $index) {
        <div fNode fDragHandle [fNodePosition]="input.position" [fNodeId]="input.nodeId">
          <lib-workflow-input-card [node]="input"
                                   (nodeChange)="updateInputNode($event)"
                                   [index]="$index + 1"
                                   [isDeleteDisabled]="isForFederatedLearning() && input.name === 'input-data'"
                                   (deleteNode)="deleteInputNode(input)">
          </lib-workflow-input-card>
          <lib-workflow-input-node-connectors [(workflow)]="workflow"
                                              [inputNode]="input"/>
        </div>
      }

    </f-canvas>
  </f-flow>
}
