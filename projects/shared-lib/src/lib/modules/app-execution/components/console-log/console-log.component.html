<div class="dynamic-container" [class.dynamic-container--docked]="docked()" [style.height.px]="dynamicHeight()">
  @if (isVisible() && docked()) {
    <div
      class="resize-handle"
      (mousedown)="onResizeStart($event)"
      [matTooltip]="'RESIZE_CONSOLE_OUTPUT' | translate"
    ></div>
  }

  <mat-toolbar>
    @if (clientConnected()) {
      <mat-icon class="connected-success" [matTooltip]="'WEB_UI_CONNECTED' | translate">sensors</mat-icon>
    } @else {
      <mat-icon class="connected-error" [matTooltip]="'WEB_UI_DISCONNECTED' | translate">error</mat-icon>
    }

    @if (appConnected()) {
      <mat-icon class="connected-success" [matTooltip]="'APP_CONNECTED' | translate">stream</mat-icon>
    } @else {
      <mat-icon class="connected-warn" [matTooltip]="'APP_DISCONNECTED' | translate">sync</mat-icon>
    }

    @if (title()) {
      <span class="console-title">{{ title() }}</span>
    }

    @if (appConnected() || !docked()) {
      <button mat-icon-button (click)="toggleConsole()">
        @if (!isVisible()) {
          <mat-icon>keyboard_arrow_up</mat-icon>
        } @else {
          <mat-icon>keyboard_arrow_down</mat-icon>
        }
      </button>
    }

    @if (isVisible()) {
      <span class="spacer"></span>

      <button mat-icon-button [matTooltip]="'DELETE_OUTPUT' | translate" (click)="deleteOutputs()">
        <mat-icon class="connected-error">delete</mat-icon>
      </button>

      <button mat-icon-button (click)="toggleFollow()">
        @if (followConsole()) {
          <mat-icon [matTooltip]="'UNFOLLOW_OUTPUT' | translate" class="connected-success">play_circle</mat-icon>
        } @else {
          <mat-icon [matTooltip]="'FOLLOW_OUTPUT' | translate" class="connected-warn">stop_circle</mat-icon>
        }
      </button>
    }
  </mat-toolbar>

  @if (isVisible()) {
    <lib-console-output
      [consoleStdOut]="outputs()"
      [followConsole]="followConsole()"
    ></lib-console-output>
  }
</div>
