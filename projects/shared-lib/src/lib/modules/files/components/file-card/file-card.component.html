<div class="file-card" (click)="onSelect()">
  <div class="file-card__main">
    <div class="file-card__icon">
      <mat-icon aria-hidden="true">description</mat-icon>
    </div>

    <div class="file-card__meta">
      <div class="file-card__name" [matTooltip]="file().fileName">{{ file().fileName }}</div>
      <div class="file-card__sub">
        <span class="muted">Size:</span> {{ file().size | bytes:1 }}
      </div>
      <div class="file-card__dates">
        <span class="muted">Created:</span> {{ file().createdAt | date:'medium' }}
      </div>
    </div>
  </div>

  <div class="file-card__aside">
    <mat-chip-set>
      <mat-chip>{{ file().contentType || '—' }}</mat-chip>
    </mat-chip-set>

    @if (showActions()) {
      <div class="actions">
        <button
          mat-stroked-button
          class="file-card__btn"
          (click)="onDelete($event)"
          [disabled]="busy()"
          matTooltip="Delete file"
        >
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
        <button
          mat-stroked-button
          class="file-card__btn"
          (click)="onDownload($event)"
          [disabled]="busy()"
          matTooltip="Download file"
        >
          <mat-icon>download</mat-icon>
          <span>Download</span>
        </button>
      </div>
    }

  </div>
</div>
