@if (selectedStep(); as step) {
  <lib-pipeline-step [step]="step" (backClicked)="selectedName.set(null)"/>
} @else {
  <section>
    <h3>Steps</h3>
    @if (steps().length) {
      <table mat-table [dataSource]="steps()" [trackBy]="trackByStep" class="pipeline-steps-table">
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element" class="status-td">
            <lib-status-badge [size]="'SMALL'" [width]="200" [type]="pipelineStatusToBadgeStatus(element?.stepStatus)"/>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Step</th>
          <td mat-cell *matCellDef="let element">{{ stepLabel(element) }}</td>
        </ng-container>

        <ng-container matColumnDef="started">
          <th mat-header-cell *matHeaderCellDef>Started</th>
          <td mat-cell *matCellDef="let element">
            <lib-time-badge color="GRAY" [date]="element?.startedAt"/>
          </td>
        </ng-container>

        <ng-container matColumnDef="duration">
          <th mat-header-cell *matHeaderCellDef>Duration</th>
          <td mat-cell *matCellDef="let element">
            <lib-time-badge [date]="element?.startedAt" [dateTo]="element.finishedAt" [calcDuration]="true"/>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectedName.set(row.name)"></tr>
      </table>
    } @else {
      <div class="pipeline-steps-empty">No steps found.</div>
    }
  </section>

  @if (pipeline()?.publishInfo; as publishInfo) {
    <section>
      <h3>Result</h3>
      <lib-pipeline-publish-info-detail [publishInfo]="publishInfo"/>
    </section>
  }
}
