<div class="history">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"/>
  }
  @if (error(); as error) {
    <lib-info-card type="ERROR" variant="NOTICE" size="SMALL" [title]="error"/>
  }

  @for (run of runs(); track run.id) {
    <div class="history__item">
      <lib-status-badge [type]="badge(run)" size="X-SMALL" [noText]="true" [animate]="false"/>
      <div class="history__main">
        <div class="history__name">{{ appName(run) }}</div>
        <div class="history__meta">
          <lib-time-badge [date]="run.startedAt ?? run.createdAt" format="SHORT" color="GRAY" size="X-SMALL"/>
          @if (outputSize(run)) {
            <span>{{ outputSize(run) | bytes }}</span>
          }
        </div>
        @if (run.status === 'ERROR' && errorOf(run); as reason) {
          <div class="history__reason" [matTooltip]="reason">{{ reason }}</div>
        }
      </div>
      @if (hasOutputs(run)) {
        <lib-btn type="DOWNLOAD" variant="GHOST" size="SMALL" [iconOnly]="true"
                 [loading]="downloadingRunId() === run.id"
                 ariaLabel="Download zip"
                 matTooltip="Download zip"
                 (clicked)="download.emit(run.id)"/>
      }
    </div>
  } @empty {
    @if (!loading()) {
      <lib-empty-state icon="history" title="No app exports yet"
                       subtitle="Exports of this cohort show up here and can be downloaded again."
                       size="SMALL"/>
    }
  }
</div>
