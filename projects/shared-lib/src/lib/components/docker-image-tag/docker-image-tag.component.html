<div class="wrapper"
     [class.clickable]="clickable() && hasImage()"
     [matTooltip]="imageName() ?? ''"
     [matTooltipDisabled]="!imageName()"
     (click)="onClicked($event)">
  <lib-badge
    [text]="displayTag()"
    [color]="resolvedColor()"
    [size]="size()"
    [border]="border()"
    [iconName]="resolvedIcon()"/>
</div>
