<mat-toolbar class="toolbar-container">
    <mat-toolbar-row>
        <button mat-button color="primary" routerLink="/" style="height: 3.2em">
            <img src="projects/shared-lib/src/assets/images/logo.png"
                 height="48" [alt]="project" loading="lazy"/>
        </button>

    <a mat-button
            *ngFor="let menuItem of menuItems"
            color="primary"
            [routerLink]="menuItem.link"
            routerLinkActive="mat-accent"
    >
      {{ menuItem.title }}
    </a>
    <span class="spacer"></span>
    <app-lib-user-menu></app-lib-user-menu>
  </mat-toolbar-row>
</mat-toolbar>
