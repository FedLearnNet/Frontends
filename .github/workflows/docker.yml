name: Docker images

on:
  push:
    branches: [main, develop]
    paths:
      - "projects/**"
      - "!projects/**/*.spec.ts"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "nginx.conf"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/fedlearnnet/frontends

jobs:
  # Version from package.json and whether it gets an image tag and a release, see FedLearnNet/.github/actions/version
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_image: ${{ steps.version.outputs.tag_image }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        uses: FedLearnNet/.github/actions/version@main

  images:
    needs: version
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: local
            flavor: fl-net
            image: local-fl-net
          - app: global
            flavor: fl-net
            image: global-fl-net
          - app: local
            flavor: microbAIome
            image: local-microbaiome
          - app: global
            flavor: microbAIome
            image: global-microbaiome
          - app: local
            flavor: dAIbetes
            image: local-daibetes
          - app: global
            flavor: dAIbetes
            image: global-daibetes
    env:
      SCRIPT: build-${{ matrix.app }}-${{ matrix.flavor }}${{ github.ref != 'refs/heads/main' && '-staging' || '' }}
      IMAGE: ${{ matrix.image }}
      TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG_IMAGE: ${{ needs.version.outputs.tag_image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Build ${{ env.SCRIPT }}
        run: npm run "$SCRIPT"

      - name: Prepare build context
        run: |
          ctx="$RUNNER_TEMP/docker-context"
          mkdir -p "$ctx/dist/app"
          cp nginx.conf "$ctx/"
          cp -r dist/app/browser "$ctx/dist/app/"
          echo "CONTEXT=$ctx" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          tag_args=(-t "$REGISTRY/$IMAGE:$TAG")
          if [ "$TAG_IMAGE" = true ]; then tag_args+=(-t "$REGISTRY/$IMAGE:$VERSION"); fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            "${tag_args[@]}" \
            -f Dockerfile \
            --push "$CONTEXT"

  # First build of a release candidate or release: git tag and GitHub release
  release:
    needs: [version, images]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes --prerelease="$PRERELEASE"

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: images
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    permissions:
      contents: read
      packages: read
      security-events: write
