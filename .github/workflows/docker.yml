name: Docker images

on:
  push:
    branches: [main, develop]
    paths:
      - "projects/**"
      - "!projects/**/*.spec.ts"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "nginx.conf"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/fedlearnnet/frontends

jobs:
  images:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [local, global]
    env:
      SCRIPT: build-${{ matrix.app }}-fl-net${{ github.ref != 'refs/heads/main' && '-staging' || '' }}
      IMAGE: ${{ matrix.app }}-fl-net:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - name: Build ${{ env.SCRIPT }}
        run: npm run "$SCRIPT"

      - name: Prepare build context
        run: |
          ctx="$RUNNER_TEMP/docker-context"
          mkdir -p "$ctx/dist/app"
          cp nginx.conf "$ctx/"
          cp -r dist/app/browser "$ctx/dist/app/"
          echo "CONTEXT=$ctx" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ env.REGISTRY }}/${{ env.IMAGE }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$REGISTRY/$IMAGE" \
            -f Dockerfile \
            --push "$CONTEXT"

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: images
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    permissions:
      contents: read
      packages: read
      security-events: write
