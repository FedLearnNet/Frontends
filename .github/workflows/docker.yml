name: Docker images

on:
  push:
    branches: [main, develop]
    paths:
      - "projects/**"
      - "!projects/**/*.spec.ts"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "nginx.conf"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/fedlearnnet/frontends

jobs:
  images:
    # main -> latest, develop -> staging*; other branches would overwrite those tags
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: "0"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All variants are built sequentially in one job so dependencies are installed only once.
      # The nginx image only copies static files, so multi-arch images need no emulation.
      - name: Build and push images
        run: |
          # <npm script> <image>:<tag>
          # Only FL-Net is published; the other brands are not deployed from this repository.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            variants="
          build-local-fl-net                    local-fl-net:latest
          build-global-fl-net                   global-fl-net:latest"
          else
            variants="
          build-local-fl-net-staging            local-fl-net:staging
          build-global-fl-net-staging           global-fl-net:staging
          fi

          # Minimal build context instead of the whole repository (node_modules)
          ctx="$RUNNER_TEMP/docker-context"
          while read -r -u 3 script target; do
            [ -z "$script" ] && continue
            echo "::group::$script -> $REGISTRY/$target"
            npm run "$script"
            rm -rf "$ctx" && mkdir -p "$ctx/dist/app"
            cp nginx.conf "$ctx/"
            cp -r dist/app/browser "$ctx/dist/app/"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$REGISTRY/$target" \
              -t "$REGISTRY/$target-${GITHUB_SHA::7}" \
              -f Dockerfile \
              --push "$ctx"
            echo "::endgroup::"
          done 3<<< "$variants"

  # Vulnerability scan after every build (results under Security → Code scanning).
  # Disabled for now, run the "Container scan" workflow manually instead. Uncomment to enable.
  # scan:
  #   needs: images
  #   uses: ./.github/workflows/scan.yml
  #   with:
  #     tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
  #   permissions:
  #     contents: read
  #     packages: read
  #     security-events: write
